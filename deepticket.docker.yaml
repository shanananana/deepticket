# Docker 默认配置（docker compose 使用）
# 本地覆盖：挂载 ./deepticket.yaml 并设置 DEEPTICKET_CONFIG=/app/deepticket.yaml

llm:
  model: openai/deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  api_key: ${LLM_API_KEY}
  label: DeepSeek V4 Flash

web:
  host: 0.0.0.0
  port: 8600
  cors_origins:
    - http://127.0.0.1:8600
    - http://localhost:8600
  sse_heartbeat_seconds: 15

auth:
  register_enabled: false
  bootstrap_username: admin
  bootstrap_password: admin
  admin_usernames:
    - admin

engine:
  agent_server_host: 127.0.0.1
  agent_server_port: 8100
  llm_profile: deepseek-v4-flash
  session_api_key: ${DEEPTICKET_SESSION_API_KEY}
  agent_timeout_seconds: 600

storage:
  backend: redis
  redis_start_docker: false
  local:
    root: ./data
  redis:
    url: redis://redis:6379/0
    username: ""
    password: ""
    key_prefix: "deepticket:"
    ttl_seconds: 31536000

knowledge:
  git_cache_dir: ./workspace/knowledge
  workspace_dir: ./workspace/project
  # Demo：ad_agent 公开仓（同步后见 scripts/docker/seed_demo_logs.sh）
  repos:
    - id: ad-agent
      url: https://github.com/shanananana/ad_agent.git
      key: ""
      branch: main
      workspace_subdir: ad-agent

extensions:
  skills_dir: deepticket/skills
  user_skills_dir: ""
  workspace_skills_dir: workspace/project/.openhands/skills
  agents_md: |
    你是 DeepTicket 项目助手，帮助同事排查故障、走读代码、分析业务指标与工单分流。

    基本原则：
    - 以 workspace 内的代码、日志、配置与文档为依据，引用具体路径与行号
    - 先复述问题与影响面，再给出结论；不确定处明确标注「待验证」
    - 默认只读：不修改代码、不执行写盘或对外发网的命令
    - 不臆造配置、指标、日志或代码；没有证据时说明缺什么信息

    回复结构（可按场景裁剪）：
    1. 摘要 — 现象与影响
    2. 分析 — 根因假设与证据
    3. 建议 — 排查步骤或可执行动作

    可用能力：
    - 检索已同步的 Git 知识库与工作区文件
    - 调用已挂载的 MCP 与 Skill（如 log-query、config-query）
    - 需要权限或环境时，说明 blocker 而非强行猜测

ingress:
  api_key: ${DEEPTICKET_INGRESS_API_KEY}
  queue_workers: 1
  queue_backlog_alert: 10
  routes:
    - type: default
      description: 默认
      match:
        default: true
      outbound:
        method: store_only

# MCP 默认关闭（Skill + 读 workspace 代码/日志即可 Demo）
mcp:
  servers: {}
