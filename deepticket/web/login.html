<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 · DeepTicket</title>
  <link rel="stylesheet" href="/static/style.css?v=10" />
</head>
<body>
  <div class="aurora"></div>
  <div class="grain"></div>

  <main class="auth-screen">
    <section class="auth-card">
      <header class="auth-head">
        <div class="brand-mark">DT</div>
        <div>
          <h1>DeepTicket</h1>
          <p class="subtitle">工单智能分析工作台</p>
        </div>
      </header>

      <div class="auth-tabs" id="authTabs" data-mode="login">
        <div class="tab-glider"></div>
        <button id="loginTabBtn" type="button" class="auth-tab active">登录</button>
        <button id="registerTabBtn" type="button" class="auth-tab">注册</button>
      </div>

      <form id="loginForm" class="auth-form">
        <div class="field">
          <label for="loginUsername">用户名</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="loginUsername" type="text" value="admin" autocomplete="username" required minlength="3" placeholder="请输入用户名" />
          </div>
        </div>
        <div class="field">
          <label for="loginPassword">密码</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="loginPassword" type="password" value="admin" autocomplete="current-password" required placeholder="请输入密码" />
          </div>
        </div>
        <button type="submit" class="btn primary full">
          <span>进入工作台</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <div class="field">
          <label for="registerUsername">用户名</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="registerUsername" type="text" autocomplete="username" required minlength="3" maxlength="32" placeholder="3-32 个字符" />
          </div>
        </div>
        <div class="field">
          <label for="registerPassword">密码</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="registerPassword" type="password" autocomplete="new-password" required minlength="6" placeholder="至少 6 个字符" />
          </div>
        </div>
        <button type="submit" class="btn primary full">
          <span>创建账户</span>
        </button>
      </form>

      <p id="authError" class="auth-error"></p>
      <p class="auth-footnote">首次使用可用 <kbd>admin</kbd> / <kbd>admin</kbd> 登录</p>
    </section>
  </main>

  <script src="/static/login.js?v=2"></script>
</body>
</html>
