# DeepTicket — 使用 GHCR 预构建镜像（无需 clone 源码、无需本地 build）
#
# 1. curl -LO https://raw.githubusercontent.com/shanananana/deepticket/main/docker-compose.image.yml
# 2. curl -LO https://raw.githubusercontent.com/shanananana/deepticket/main/.env.docker.example && cp .env.docker.example .env
# 3. docker compose -f docker-compose.image.yml up -d
# 4. 打开 http://127.0.0.1:8600 （admin / admin）
#
# 固定版本示例：把 image 改为 ghcr.io/shanananana/deepticket:v0.2.4

services:
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: deepticket-redis
    restart: unless-stopped
    volumes:
      - deepticket_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  deepticket:
    image: ghcr.io/shanananana/deepticket:latest
    container_name: deepticket
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8600:8600"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPTICKET_CONFIG: /app/deepticket.docker.yaml
      REDIS_URL: redis://redis:6379/0
    volumes:
      - deepticket_data:/app/data
      - deepticket_workspace:/app/workspace

volumes:
  deepticket_redis_data:
  deepticket_data:
  deepticket_workspace:
