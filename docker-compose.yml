# DeepTicket — Docker 一键启动
#
# 1. cp .env.docker.example .env   # LLM 可选，也可启动后在 Web 配置
# 2. docker compose up -d --build
# 3. 打开 http://127.0.0.1:8600  （admin / admin）
#
# 可选：挂载本地配置覆盖默认
#   volumes 里取消 deepticket.yaml 注释，并设置 DEEPTICKET_CONFIG=/app/deepticket.yaml

services:
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: deepticket-redis
    restart: unless-stopped
    volumes:
      - deepticket_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"

  deepticket:
    build:
      context: .
      args:
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    container_name: deepticket
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8600:8600"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      # 持久化到 data 卷；侧栏「LLM 配置」写入 /app/data/deepticket.yaml，重建容器不丢
      DEEPTICKET_CONFIG: /app/data/deepticket.yaml
      REDIS_URL: redis://redis:6379/0
    volumes:
      - deepticket_data:/app/data
      - deepticket_workspace:/app/workspace
      # 使用本地 yaml 时取消下一行注释，并改 DEEPTICKET_CONFIG=/app/deepticket.yaml
      # - ./deepticket.yaml:/app/deepticket.yaml:ro

volumes:
  deepticket_redis_data:
  deepticket_data:
  deepticket_workspace:
