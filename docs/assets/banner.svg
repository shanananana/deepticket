<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-label="DeepTicket">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="960" height="200" rx="16" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="780" cy="28" r="72" fill="#3b82f6" opacity="0.10" filter="url(#blur)"/>
  <circle cx="120" cy="168" r="56" fill="#60a5fa" opacity="0.12" filter="url(#blur)"/>

  <g transform="translate(40,52)">
    <rect width="64" height="64" rx="16" fill="url(#logo)"/>
    <text x="32" y="42" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700">DT</text>
  </g>

  <text x="124" y="82" fill="#0f172a" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="700" letter-spacing="-0.5">DeepTicket</text>
  <text x="126" y="114" fill="#64748b" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="17">智能 Agent 平台 · 故障排查与项目答疑</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600">
    <rect x="126" y="132" width="92" height="28" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="172" y="151" text-anchor="middle" fill="#1d4ed8">OpenHands</text>
    <rect x="226" y="132" width="72" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="262" y="151" text-anchor="middle" fill="#475569">Ingress</text>
    <rect x="306" y="132" width="88" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="350" y="151" text-anchor="middle" fill="#475569">Webhook</text>
    <rect x="402" y="132" width="56" height="28" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="430" y="151" text-anchor="middle" fill="#475569">MCP</text>
  </g>
</svg>
